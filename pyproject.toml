[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "collecte-cfe"
version = "0.1.0"
description = "Collecte locale des avis CFE pour cabinets comptables"
license = "EUPL-1.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "playwright>=1.50,<2", "openpyxl>=3.1,<4", "pypdf>=5,<7", "reportlab>=4.2,<5", "keyring>=25,<27", "ddddocr>=1.5,<1.7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pymupdf>=1.25,<2", "pyinstaller>=6,<7"]

[project.scripts]
collecte-cfe = "collecte_cfe.app:main"

[tool.setuptools.packages.find]
include = ["collecte_cfe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
collecte_cfe = ["assets/*.png", "assets/*.svg", "assets/icons/*.svg", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "SIM105", "SIM108", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B018"]
